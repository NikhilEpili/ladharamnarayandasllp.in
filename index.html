<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Ladharam Narayandas LLP — Website under development. Coming soon."
    />
    <title>Ladharam Narayandas LLP — Coming Soon</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        background-color: #fdfbf7;
        color: #1a3d1a;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem 1.5rem 1rem;
        text-align: center;
      }

      .logo {
        max-width: min(420px, 88vw);
        height: auto;
        display: block;
        margin-bottom: 2rem;
      }

      h1 {
        font-size: clamp(1.25rem, 4vw, 1.75rem);
        font-weight: 600;
        line-height: 1.45;
        margin: 0;
        letter-spacing: 0.02em;
      }

      .coming-soon {
        display: block;
        margin-top: 0.5rem;
        color: #d4a017;
        font-weight: 700;
      }

      footer {
        padding: 1.25rem 1.5rem 1.75rem;
        text-align: center;
        font-size: 0.875rem;
        color: #1a3d1a;
        opacity: 0.85;
        border-top: 1px solid rgba(212, 160, 23, 0.35);
      }
    </style>
  </head>
  <body>
    <main>
      <img
        class="logo"
        src="IMG_1362.JPEG"
        alt="Ladharam Narayandas LLP — Since 1957"
        width="800"
        height="800"
      />
      <h1>
        Website Under Development.
        <span class="coming-soon">Coming Soon!</span>
      </h1>
    </main>
    <footer>Website designed by MB Creatives</footer>
  </body>
</html>
