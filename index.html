<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#14330e">
<title>Coming Soon | Ladharam Narayandas LLP</title>
<meta name="description" content="Our new website is on the way. Ladharam Narayandas LLP — HoReCa supply partner since 1957.">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="assets/favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="assets/favicon-16.png" type="image/png" sizes="16x16">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png" sizes="180x180">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f6f5ef;
  --green-deep: #14330e;
  --text: #15241a;
  --muted: #566559;
  --font: "Plus Jakarta Sans", system-ui, sans-serif;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 2rem 1.25rem;
  background: radial-gradient(ellipse 120% 80% at 50% 0%, #ebefe0 0%, var(--bg) 55%);
  color: var(--text);
  font-family: var(--font);
  text-align: center;
  -webkit-font-smoothing: antialiased;
}
.logo {
  display: block;
  width: min(18rem, 88vw);
  max-width: 320px;
  height: auto;
  margin-bottom: 1.75rem;
}
.badge {
  display: inline-block;
  margin-bottom: 1rem;
  padding: 0.35rem 0.85rem;
  border-radius: 999px;
  background: rgba(20, 51, 14, 0.08);
  color: var(--green-deep);
  font-size: 0.8125rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
h1 {
  margin: 0 0 0.75rem;
  max-width: 16ch;
  font-size: clamp(1.75rem, 5vw, 2.35rem);
  font-weight: 800;
  line-height: 1.15;
  color: var(--green-deep);
}
p {
  margin: 0 auto 1.75rem;
  max-width: 36rem;
  font-size: 1.0625rem;
  line-height: 1.6;
  color: var(--muted);
}
.contact {
  margin-top: 1.25rem;
  font-size: 0.9375rem;
  color: var(--muted);
}
.contact a {
  color: var(--green-deep);
  font-weight: 600;
  text-decoration: none;
}
.contact a:hover { text-decoration: underline; }
</style>
</head>
<body>
<img class="logo" src="assets/logo.png" alt="Ladharam Narayandas LLP" width="320" height="480" decoding="async" fetchpriority="high">
<p class="badge">Established 1957</p>
<h1>Our website is coming soon</h1>
<p>
  We are preparing a refreshed online experience for Ladharam Narayandas LLP.
  For supply enquiries, please call us.
</p>
<p class="contact">

</p>
</body>
